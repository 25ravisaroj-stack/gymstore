
@if(product){

<div class="container mt-4">

  <img
    [src]="product.image"
    class="img-fluid"
    width="300"
  >

  <h2>{{ product.name }}</h2>

  <h4>₹{{ product.price }}</h4>

  <p>{{ product.description }}</p>

  @if(product.stock > 0){
    <span class="badge bg-success">
      In Stock : {{ product.stock }}
    </span>
  } @else {
    <span class="badge bg-danger">
      Out Of Stock
    </span>
  }

</div>

}
@else {
  <span> no data </span>
}
