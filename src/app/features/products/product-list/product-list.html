<div class="container mt-4" #productContainer>

  <div class="row">

    @for(product of store.products();
    track product.id){

    <div class="col-lg-3 col-md-4 mb-4">

      <div class="card product-card">

        <img [src]="product.image" (click)="redirectToProdutDetail(product.id)" class="card-img-top">

        <div class="card-body">

          <button (click)="redirectToProdutDetail(product.id)" class="btn p-0 border-0 info">


            {{product.name}}

          </button>

          <h4>

            ₹ {{product.price}}
            @if(!product.stock || product.stock <= 0){ <span class="badge bg-danger">
                Out Of Stock
                </span>
                }
              @else{
                <span class="badge bg-success">
                  In Stock : {{product.stock}}
                </span>
              }

          </h4>
          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" (click)="decrease(product)">
              -
            </button>

            <span class="fw-bold px-2">
              {{ quantities[product.id] }}
            </span>

            <button class="btn btn-sm btn-outline-secondary" (click)="Increase(product)">
              +
            </button>
          </div>

          <button class="btn btn-success w-100 mt-3" [disabled]="!product.stock || product.stock <= 0"
            (click)="addToCart(product)">

            Add To Cart

          </button>
        
        </div>

      </div>

    </div>

    }

  </div>

</div>
